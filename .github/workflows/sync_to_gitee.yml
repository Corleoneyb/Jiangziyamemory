name: Sync to Gitee

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee https://Corleoneyb:${{ secrets.GITEE_TOKEN }}@gitee.com/Corleoneyb/jiangziyamemory.git
          git push gitee main --force
